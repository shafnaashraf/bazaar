<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazaar · Mini-Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand:#0d9488; --brand-2:#0891b2; --brand-dark:#0f766e;
      --accent:#f59e0b; --accent-soft:#fef3c7;
      --ink:#0f172a; --muted:#64748b; --faint:#94a3b8;
      --line:#e6ecf1; --bg:#eef2f6; --card:#ffffff;
      --ring:rgba(13,148,136,.35);
      --shadow-sm:0 1px 2px rgba(15,23,42,.06);
      --shadow-md:0 10px 30px -12px rgba(15,23,42,.22);
      --shadow-lg:0 30px 60px -20px rgba(15,23,42,.30);
      --radius:18px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(8,145,178,.10), transparent 60%),
        radial-gradient(1000px 500px at -10% 0%, rgba(13,148,136,.10), transparent 55%),
        var(--bg);
      min-height:100vh;
    }

    /* ---------- HEADER ---------- */
    header {
      position:relative; overflow:hidden; color:#fff;
      padding:40px 24px 90px;
      background:linear-gradient(135deg,#0f766e 0%,#0d9488 45%,#0891b2 100%);
    }
    header::before {
      content:""; position:absolute; inset:0;
      background:
        radial-gradient(600px 300px at 85% -20%, rgba(255,255,255,.22), transparent 60%),
        radial-gradient(500px 260px at 10% 120%, rgba(255,255,255,.14), transparent 60%);
    }
    header::after {
      content:""; position:absolute; left:0; right:0; bottom:-1px; height:70px;
      background:var(--bg);
      -webkit-mask:radial-gradient(38px 38px at 50% 0,transparent 98%,#000) repeat-x;
      mask:radial-gradient(38px 38px at 50% 0,transparent 98%,#000) repeat-x;
      -webkit-mask-size:76px 76px; mask-size:76px 76px;
    }
    .header-inner {
      position:relative; z-index:2; max-width:1200px; margin:0 auto;
      display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;
    }
    .brand-row { display:flex; align-items:center; gap:14px; }
    .logo {
      width:52px; height:52px; border-radius:16px; flex:0 0 auto;
      display:grid; place-items:center; font-size:26px;
      background:rgba(255,255,255,.16); backdrop-filter:blur(6px);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
    }
    header h1 {
      font-family:"Sora",sans-serif; font-size:34px; font-weight:800;
      letter-spacing:-1px; line-height:1;
    }
    header .tag { opacity:.9; font-size:14px; margin-top:6px; font-weight:500; }
    .search { margin-top:26px; position:relative; max-width:460px; }
    .search input {
      width:100%; padding:15px 16px 15px 46px; border:0; border-radius:14px;
      font-size:15px; font-family:inherit; outline:none; color:var(--ink);
      background:rgba(255,255,255,.96);
      box-shadow:0 10px 30px -10px rgba(0,0,0,.4), 0 0 0 0 var(--ring);
      transition:box-shadow .2s, transform .2s;
    }
    .search input:focus { box-shadow:0 12px 34px -10px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.35); }
    .search input::placeholder { color:var(--faint); }
    .search::before {
      content:"🔍"; position:absolute; left:16px; top:50%;
      transform:translateY(-50%); font-size:15px; opacity:.55;
    }
    .cart-pill {
      display:inline-flex; align-items:center; gap:8px;
      background:rgba(255,255,255,.18); color:#fff; border-radius:999px;
      padding:11px 20px; font-size:14px; font-weight:700; white-space:nowrap;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.28); backdrop-filter:blur(8px);
      transition:transform .18s;
    }
    .cart-pill.bump { animation:bump .4s ease; }
    @keyframes bump { 0%{transform:scale(1)} 35%{transform:scale(1.14)} 100%{transform:scale(1)} }

    /* ---------- LAYOUT ---------- */
    .layout {
      max-width:1200px; margin:-52px auto 48px; padding:0 24px; position:relative; z-index:3;
      display:grid; grid-template-columns:1fr 360px; gap:26px; align-items:start;
    }
    @media (max-width:900px){ .layout { grid-template-columns:1fr; } }

    /* ---------- TOOLBAR / CHIPS ---------- */
    .toolbar {
      background:var(--card); border:1px solid var(--line); border-radius:16px;
      padding:14px 16px; box-shadow:var(--shadow-sm);
      display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:12px; margin-bottom:22px;
    }
    .chips { display:flex; gap:8px; flex-wrap:wrap; }
    .chip {
      padding:8px 16px; border:1px solid var(--line); background:#fff;
      border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
      color:var(--muted); transition:.18s; font-family:inherit;
    }
    .chip:hover { border-color:var(--brand); color:var(--brand); transform:translateY(-1px); }
    .chip.active {
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      border-color:transparent; color:#fff; box-shadow:0 8px 18px -8px var(--ring);
    }
    .count { font-size:13px; color:var(--muted); font-weight:600; padding-right:4px; }

    /* ---------- PRODUCT GRID ---------- */
    .grid { display:grid; gap:22px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
    .card {
      background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      overflow:hidden; display:flex; flex-direction:column; position:relative;
      box-shadow:var(--shadow-sm); transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s;
      animation:fadeUp .5s both;
    }
    @keyframes fadeUp { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
    .card:hover { transform:translateY(-6px); box-shadow:var(--shadow-lg); border-color:#d6e0e8; }
    .thumb { position:relative; aspect-ratio:4/3; background:linear-gradient(135deg,#eef3f6,#e2eaef); overflow:hidden; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
    .card:hover .thumb img { transform:scale(1.07); }
    .badge {
      position:absolute; top:12px; left:12px;
      background:rgba(15,23,42,.72); color:#fff; font-size:11px; font-weight:700;
      letter-spacing:.3px; padding:5px 11px; border-radius:999px;
      backdrop-filter:blur(4px); text-transform:uppercase;
    }
    .stock {
      position:absolute; top:12px; right:12px; font-size:11px; font-weight:700;
      padding:5px 11px; border-radius:999px; display:inline-flex; align-items:center; gap:5px;
      box-shadow:var(--shadow-sm);
    }
    .stock::before { content:""; width:6px; height:6px; border-radius:50%; }
    .stock.in { background:#dcfce7; color:#15803d; } .stock.in::before { background:#22c55e; }
    .stock.out { background:#fee2e2; color:#b91c1c; } .stock.out::before { background:#ef4444; }
    .body { padding:16px; display:flex; flex-direction:column; gap:6px; flex:1; }
    .body h3 { font-size:15.5px; font-weight:700; letter-spacing:-.2px; }
    .price { font-size:20px; font-weight:800; color:var(--ink); margin-top:2px;
             font-family:"Sora",sans-serif; }
    .price .cur { font-size:12px; font-weight:700; color:var(--brand); }
    .price small { font-size:12px; font-weight:600; color:var(--faint); }
    button.add {
      margin-top:12px; color:#fff; border:0; border-radius:12px;
      padding:11px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:inherit;
      background:linear-gradient(135deg,var(--brand),var(--brand-2));
      box-shadow:0 10px 20px -10px var(--ring); transition:.18s;
      display:flex; align-items:center; justify-content:center; gap:7px;
    }
    button.add:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 16px 26px -12px var(--ring); }
    button.add:active:not(:disabled) { transform:translateY(0); }
    button.add:disabled { background:#e2e8f0; color:#94a3b8; cursor:not-allowed; box-shadow:none; }

    /* ---------- CART ---------- */
    .cart {
      background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px;
      position:sticky; top:22px; box-shadow:var(--shadow-md);
    }
    .cart h2 {
      font-family:"Sora",sans-serif; font-size:18px; font-weight:700; margin-bottom:14px;
      display:flex; align-items:center; gap:9px;
    }
    .cart h2::before { content:"🛍️"; font-size:18px; }
    .citem {
      display:flex; align-items:center; gap:10px; padding:12px 0;
      border-bottom:1px solid var(--line); font-size:13.5px;
      animation:fadeUp .3s both;
    }
    .citem:last-of-type { border-bottom:0; }
    .citem .nm { flex:1; font-weight:600; }
    .citem .lt { font-weight:800; min-width:78px; text-align:right; font-family:"Sora",sans-serif; }
    .qty { display:flex; align-items:center; gap:4px; background:#f1f5f9; border-radius:10px; padding:3px; }
    .qty button {
      width:26px; height:26px; border:0; background:#fff; color:var(--ink);
      border-radius:8px; cursor:pointer; font-size:15px; line-height:1; font-weight:700;
      box-shadow:var(--shadow-sm); transition:.15s;
    }
    .qty button:hover { color:var(--brand); }
    .qty span { min-width:20px; text-align:center; font-weight:700; }
    .rm { background:none; border:0; color:#cbd5e1; cursor:pointer; font-size:18px; transition:.15s; }
    .rm:hover { color:#ef4444; }
    .totrow {
      display:flex; justify-content:space-between; align-items:baseline;
      font-weight:800; font-size:17px; margin-top:18px; padding-top:16px;
      border-top:2px dashed var(--line); font-family:"Sora",sans-serif;
    }
    .totrow span:first-child { font-size:14px; color:var(--muted); font-family:inherit; font-weight:600; }
    .discount-input {
      width:100%; margin-top:16px; padding:12px 14px; border:1.5px solid var(--line);
      border-radius:12px; font-size:13.5px; outline:none; font-family:inherit;
      transition:border-color .18s, box-shadow .18s; background:#fbfdfe;
    }
    .discount-input:focus { border-color:var(--brand); box-shadow:0 0 0 4px var(--ring); background:#fff; }
    .discount-input::placeholder { color:var(--faint); }
    .checkout {
      width:100%; margin-top:14px; color:#fff; border:0; border-radius:14px;
      padding:15px; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
      background:linear-gradient(135deg,var(--brand-dark),var(--brand-2));
      box-shadow:0 16px 30px -12px var(--ring); transition:.18s;
      letter-spacing:.2px;
    }
    .checkout:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 22px 38px -14px var(--ring); }
    .checkout:disabled { background:#cbd5e1; cursor:not-allowed; box-shadow:none; transform:none; }
    .cstatus { font-size:13px; margin-top:10px; min-height:18px; font-weight:600; text-align:center; }
    .cstatus.ok { color:var(--brand); } .cstatus.err { color:#dc2626; }
    .receipt {
      background:linear-gradient(180deg,#ecfdf5,#f0fdfa); border:1px solid #a7f3d0;
      border-radius:14px; padding:16px; margin-top:14px; font-size:13px; line-height:1.7;
      animation:fadeUp .4s both;
    }
    .receipt strong { color:var(--brand-dark); }
    .empty { color:var(--muted); font-size:13.5px; padding:22px 8px; text-align:center; }
    .empty::before { content:"🛒"; display:block; font-size:30px; margin-bottom:8px; opacity:.55; }

    /* ---------- STATES ---------- */
    .state { grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--muted); font-weight:500; }
    .spinner {
      width:38px; height:38px; border:3px solid var(--line); border-top-color:var(--brand);
      border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .skeleton { grid-column:auto; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="brand-row">
          <div class="logo">🛒</div>
          <div>
            <h1>Bazaar</h1>
            <p class="tag">Fresh picks, delivered fast.</p>
          </div>
        </div>
        <div class="search"><input id="search" type="text" placeholder="Search products..." /></div>
      </div>
      <div class="cart-pill" id="cart-pill">🛒 0 items</div>
    </div>
  </header>

  <div class="layout">
    <section>
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <div class="count" id="count"></div>
      </div>
      <div id="products" class="grid"></div>
    </section>

    <aside>
      <div class="cart">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <div class="totrow"><span>Subtotal</span><span id="subtotal">AED 0.00</span></div>
        <input id="discount" class="discount-input" type="text"
               placeholder="Discount code (try FLAT50)" />
        <button class="checkout" id="checkout-btn">Checkout →</button>
        <div id="status" class="cstatus"></div>
        <div id="receipt"></div>
      </div>
    </aside>
  </div>

<script>
// --- state ---
let allProducts = [], activeCategory = "All", searchText = "", cartId = null;

// fetch helper supporting all methods + JSON
async function api(path, options = {}) {
  const res = await fetch(path, { headers:{ "Content-Type":"application/json" }, ...options });
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error((data && (data.detail || JSON.stringify(data))) || res.statusText);
  return data;
}

// --- cart bootstrap: reuse a saved cart or create a new one ---
async function ensureCart() {
  const saved = localStorage.getItem("bazaar_cart_id");
  if (saved) {
    try { renderCart(await api(`/api/carts/${saved}/`)); cartId = saved; return; }
    catch (_) { localStorage.removeItem("bazaar_cart_id"); }
  }
  const cart = await api("/api/carts/", { method:"POST" });
  cartId = cart.id;
  localStorage.setItem("bazaar_cart_id", cartId);
  renderCart(cart);
}

// --- products ---
async function loadProducts() {
  const box = document.getElementById("products");
  box.innerHTML = '<div class="state"><div class="spinner"></div>Loading fresh picks…</div>';
  try { allProducts = await api("/api/products/"); }
  catch (e) { box.innerHTML = `<div class="state">${e.message}</div>`; return; }
  renderChips(); renderProducts();
}

function renderChips() {
  const cats = ["All", ...new Set(allProducts.map(p => p.category_name))];
  const chips = document.getElementById("chips"); chips.innerHTML = "";
  for (const c of cats) {
    const el = document.createElement("button");
    el.className = "chip" + (c === activeCategory ? " active" : "");
    el.textContent = c;
    el.onclick = () => { activeCategory = c; renderChips(); renderProducts(); };
    chips.appendChild(el);
  }
}

function renderProducts() {
  const box = document.getElementById("products");
  const list = allProducts.filter(p =>
    (activeCategory === "All" || p.category_name === activeCategory) &&
    p.name.toLowerCase().includes(searchText.toLowerCase()));
  document.getElementById("count").textContent =
    `${list.length} product${list.length === 1 ? "" : "s"}`;
  if (!list.length) { box.innerHTML = '<div class="state">No products match your search.</div>'; return; }
  box.innerHTML = "";
  let i = 0;
  for (const p of list) {
    const img = `<img src="${p.image|| 'https://placehold.co/400x300?text=No+Image'}"
                 alt="${p.name}" onerror="this.src='https://placehold.co/400x300?text=No+Image'">`;
    const stock = p.in_stock ? `<span class="stock in">In stock</span>`
                             : `<span class="stock out">Sold out</span>`;
    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i++ * 40) + "ms";
    card.innerHTML = `
      <div class="thumb">${img}<span class="badge">${p.category_name}</span>${stock}</div>
      <div class="body">
        <h3>${p.name}</h3>
        <div class="price"><span class="cur">AED</span> ${p.price} <small>each</small></div>
        <button class="add" data-id="${p.id}" ${p.in_stock ? "" : "disabled"}>
          ${p.in_stock ? "🛒 Add to cart" : "Unavailable"}
        </button>
      </div>`;
    if (p.in_stock) card.querySelector("button.add").onclick = () => addToCart(p.id);
    box.appendChild(card);
  }
}

// --- cart actions ---
function bumpCart() {
  const pill = document.getElementById("cart-pill");
  pill.classList.remove("bump"); void pill.offsetWidth; pill.classList.add("bump");
}
async function addToCart(productId) {
  try {
    const cart = await api(`/api/carts/${cartId}/items/`,
      { method:"POST", body: JSON.stringify({ product: productId, quantity: 1 }) });
    renderCart(cart); bumpCart();
  } catch (e) { alert(e.message); }
}
async function changeQty(productId, quantity) {
  try {
    const cart = await api(`/api/carts/${cartId}/items/${productId}/`,
      { method:"PATCH", body: JSON.stringify({ quantity }) });
    renderCart(cart);
  } catch (e) { alert(e.message); }
}
async function removeItem(productId) {
  renderCart(await api(`/api/carts/${cartId}/items/${productId}/`, { method:"DELETE" }));
}

function renderCart(cart) {
  const box = document.getElementById("cart-items");
  box.innerHTML = "";
  if (!cart.items.length) box.innerHTML = '<div class="empty">Your cart is empty.</div>';
  for (const it of cart.items) {
    const row = document.createElement("div");
    row.className = "citem";
    row.innerHTML = `
      <span class="nm">${it.product_name}</span>
      <span class="qty">
        <button data-a="dec">−</button><span>${it.quantity}</span><button data-a="inc">+</button>
      </span>
      <span class="lt">AED ${it.line_total}</span>
      <button class="rm" title="Remove">×</button>`;
    row.querySelector('[data-a="dec"]').onclick = () => changeQty(it.product, it.quantity - 1);
    row.querySelector('[data-a="inc"]').onclick = () => changeQty(it.product, it.quantity + 1);
    row.querySelector(".rm").onclick = () => removeItem(it.product);
    box.appendChild(row);
  }
  document.getElementById("subtotal").textContent = `AED ${cart.subtotal ?? "0.00"}`;
  document.getElementById("cart-pill").textContent = `🛒 ${cart.item_count ?? 0} items`;
}

// --- checkout ---
function setStatus(msg, kind) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "cstatus " + (kind || "");
}

async function checkout() {
  const btn = document.getElementById("checkout-btn");
  const code = document.getElementById("discount").value.trim();
  btn.disabled = true;
  setStatus("Placing order…", "ok");
  try {
    const body = { cart: cartId };
    if (code) body.discount_code = code;          // only send if provided
    const order = await api("/api/checkout/", { method:"POST", body: JSON.stringify(body) });
    showReceipt(order);
    pollOrder(order.reference);                   // watch PENDING → CONFIRMED
    localStorage.removeItem("bazaar_cart_id");    // this cart is now spent
    await ensureCart();                           // start a fresh cart
    await loadProducts();                         // stock changed, refresh listing
    setStatus("Order placed!", "ok");
    document.getElementById("discount").value = "";
  } catch (e) {
    setStatus(e.message, "err");                  // shows out-of-stock / bad-code errors
  } finally {
    btn.disabled = false;
  }
}

// Render the order confirmation receipt.
function showReceipt(order) {
  const lines = order.items
    .map(i => `${i.quantity} × ${i.product_name} @ AED ${i.unit_price}`).join("<br>");
  document.getElementById("receipt").innerHTML = `
    <div class="receipt">
      <strong>Order ${order.reference.slice(0,8)}</strong>
      · <span id="order-status">${order.status_display}</span><br><br>
      ${lines}<br><br>
      Subtotal: AED ${order.subtotal}<br>
      Discount: −AED ${order.discount_amount}<br>
      <strong>Total: AED ${order.total}</strong>
    </div>`;
}

// Poll the order until the Celery worker flips it to CONFIRMED.
async function pollOrder(reference) {
  for (let i = 0; i < 10; i++) {
    await new Promise(r => setTimeout(r, 1500));
    try {
      const order = await api(`/api/orders/${reference}/`);
      const el = document.getElementById("order-status");
      if (el) el.textContent = order.status_display;
      if (order.status === "CONFIRMED") return;
    } catch (_) { return; }
  }
}

// live search + checkout
document.getElementById("search").addEventListener("input", (e) => {
  searchText = e.target.value; renderProducts();
});
document.getElementById("checkout-btn").addEventListener("click", checkout);

// go
(async function init() { await ensureCart(); await loadProducts(); })();
</script>
</body>
</html>
