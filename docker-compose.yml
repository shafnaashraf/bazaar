services:
  db:
    image: postgres:16
    container_name: bazaar_db
    environment:
      POSTGRES_DB: bazaar
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: bazaar
    ports:
      - "5432:5432"
    volumes:
      - bazaar_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bazaar_redis
    ports:
      - "6379:6379"

volumes:
  bazaar_pgdata: